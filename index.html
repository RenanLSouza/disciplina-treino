<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#093F25" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="light dark" />
    <title>Disciplina 2.0 Treino</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    />
    <style>
/* Layout: app de celular. Topo fixo (semana + dia), conteúdo em cartões, navegação inferior com 4 abas. */
:root {
  --bg: #eef4f0;
  --surface: #ffffff;
  --surface-2: #e3eee7;
  --ink: #0c1e15;
  --muted: #536a5d;
  --line: #d0dfd5;
  --accent: #0e9f57;
  --accent-strong: #0a7b43;
  --accent-ink: #ffffff;
  --accent-soft: #d5f2e1;
  --hero-a: #093f25;
  --hero-b: #0e7a43;
  --on-hero: #ffffff;
  --on-hero-muted: #bfe6cf;
  --lime: #c6f432;
  --lime-ink: #10300a;
  --warn: #b45309;
  --warn-soft: #fdebd3;
  --shadow: 0 1px 2px rgba(10, 60, 30, 0.06), 0 6px 18px rgba(10, 60, 30, 0.07);
  --font-display: 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif;
  --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --nav-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #07120d;
    --surface: #0e1d15;
    --surface-2: #14281d;
    --ink: #e6f4eb;
    --muted: #8ca699;
    --line: #1c3727;
    --accent: #3ddc84;
    --accent-strong: #6ce9a3;
    --accent-ink: #04200f;
    --accent-soft: #12341f;
    --hero-a: #07301c;
    --hero-b: #0d5f36;
    --warn: #f0a04b;
    --warn-soft: #3a2810;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 18px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #07120d;
  --surface: #0e1d15;
  --surface-2: #14281d;
  --ink: #e6f4eb;
  --muted: #8ca699;
  --line: #1c3727;
  --accent: #3ddc84;
  --accent-strong: #6ce9a3;
  --accent-ink: #04200f;
  --accent-soft: #12341f;
  --hero-a: #07301c;
  --hero-b: #0d5f36;
  --warn: #f0a04b;
  --warn-soft: #3a2810;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 18px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
[hidden] {
  display: none !important;
}
html {
  scroll-behavior: smooth;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-inline: 0;
  padding-block: 0 calc(var(--nav-h) + 24px);
}
body::before {
  content: '';
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--hero-a);
}
button,
input,
textarea,
select {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.wrap {
  max-width: 640px;
  margin: 0 auto;
}
.page {
  padding-inline: max(16px, env(safe-area-inset-left, 0px))
    max(16px, env(safe-area-inset-right, 0px));
}
h1,
h2,
h3,
p {
  margin: 0;
}
.num {
  font-variant-numeric: tabular-nums;
}

/* ---------- topo ---------- */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  padding-inline: max(16px, env(safe-area-inset-left, 0px))
    max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(160deg, var(--hero-a), var(--hero-b));
  color: var(--on-hero);
  padding-block: 12px 10px;
  box-shadow: 0 6px 20px rgba(5, 40, 20, 0.25);
}
.top .wrap {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.brand {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.brand h1 {
  white-space: nowrap;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 26px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  line-height: 1;
}
.brand h1 b {
  color: var(--lime);
  font-weight: 700;
}
.brand small {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--on-hero-muted);
  font-weight: 600;
}
.chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 2px;
}
.chips::-webkit-scrollbar {
  display: none;
}
.wk {
  flex: 0 0 auto;
  min-width: 44px;
  height: 34px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.22);
  background: rgba(255, 255, 255, 0.08);
  color: var(--on-hero);
  font-weight: 700;
  font-size: 13px;
  padding: 0 12px;
}
.wk[aria-pressed='true'] {
  background: var(--lime);
  color: var(--lime-ink);
  border-color: var(--lime);
}
.wk[data-b='3']:not([aria-pressed='true']) {
  border-color: rgba(198, 244, 50, 0.5);
}
.blockline {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  color: var(--on-hero-muted);
}
.rpe {
  background: var(--lime);
  color: var(--lime-ink);
  font-weight: 800;
  border-radius: 6px;
  padding: 1px 7px;
  font-size: 12px;
  letter-spacing: 0.04em;
}
.days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.dy {
  position: relative;
  border: 0;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.08);
  color: var(--on-hero);
  padding: 6px 0 7px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  font-weight: 700;
}
.dy span {
  font-size: 11px;
  letter-spacing: 0.06em;
}
.dy em {
  font-style: normal;
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 600;
  opacity: 0.75;
  letter-spacing: 0.04em;
}
.dy[aria-pressed='true'] {
  background: var(--surface);
  color: var(--ink);
}
.dy[aria-pressed='true'] em {
  opacity: 0.7;
}
.dy i {
  position: absolute;
  top: 4px;
  right: 5px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--lime);
}
.dy.today span::after {
  content: '';
  display: block;
  width: 14px;
  height: 2px;
  border-radius: 2px;
  background: currentColor;
  margin: 2px auto 0;
  opacity: 0.8;
}

/* ---------- conteúdo ---------- */
main {
  padding-top: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 16px;
  box-shadow: var(--shadow);
}
.dayhead {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.dayhead .k {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
}
.dayhead h2 {
  font-family: var(--font-display);
  font-size: 30px;
  line-height: 1.02;
  font-weight: 700;
  letter-spacing: 0.01em;
  text-wrap: balance;
}
.pills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 12px;
  font-weight: 700;
  background: var(--accent-soft);
  color: var(--accent-strong);
}
.pill.warn {
  background: var(--warn-soft);
  color: var(--warn);
}
.pill.ghost {
  background: var(--surface-2);
  color: var(--muted);
}
.bar {
  height: 8px;
  border-radius: 99px;
  background: var(--surface-2);
  overflow: hidden;
}
.bar > i {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--accent), var(--lime));
  width: 0;
  transition: width 0.3s;
}
.barlab {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
  margin-bottom: 6px;
}
.banner {
  border-radius: 14px;
  padding: 12px 14px;
  background: var(--warn-soft);
  color: var(--warn);
  font-weight: 600;
  font-size: 13.5px;
}
details > summary {
  list-style: none;
  cursor: pointer;
}
details > summary::-webkit-details-marker {
  display: none;
}
.sum {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-weight: 700;
}
.sum svg {
  transition: transform 0.2s;
  flex: none;
}
details[open] > .sum svg {
  transform: rotate(180deg);
}
.sched {
  list-style: none;
  margin: 12px 0 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.sched li {
  display: grid;
  grid-template-columns: 96px 1fr;
  gap: 8px;
  padding: 6px 8px;
  border-radius: 8px;
  font-size: 13.5px;
}
.sched li b {
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  font-weight: 700;
  font-size: 12.5px;
}
.sched li.hl {
  background: var(--accent-soft);
  color: var(--accent-strong);
  font-weight: 700;
}
.sched li.hl b {
  color: inherit;
}

.ex {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.ex-top {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.ex-n {
  flex: none;
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--accent);
  color: var(--accent-ink);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  display: grid;
  place-items: center;
}
.ex-n.b {
  background: var(--lime);
  color: var(--lime-ink);
}
.ex h3 {
  font-size: 17px;
  font-weight: 800;
  line-height: 1.2;
}
.ex .mu {
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
  margin-top: 2px;
}
.spec {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.spec div {
  background: var(--surface-2);
  border-radius: 12px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.spec small {
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
}
.spec strong {
  font-family: var(--font-display);
  font-size: 25px;
  line-height: 1;
  font-weight: 700;
  white-space: nowrap;
}
.spec strong.hot {
  color: var(--accent-strong);
}
.tech {
  border-left: 3px solid var(--lime);
  padding: 2px 0 2px 10px;
  font-size: 13px;
  color: var(--muted);
}
.tech b {
  color: var(--ink);
}
.hint {
  font-size: 13px;
  border-radius: 12px;
  padding: 9px 12px;
  background: var(--accent-soft);
  color: var(--accent-strong);
  font-weight: 600;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.hint span {
  font-weight: 500;
  color: var(--ink);
  opacity: 0.8;
  font-size: 12.5px;
}
.sets {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.srow {
  display: grid;
  grid-template-columns: 28px 1fr 1fr 44px;
  gap: 8px;
  align-items: center;
}
.srow > span {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 18px;
  color: var(--muted);
  text-align: center;
}
.fld {
  display: flex;
  align-items: center;
  background: var(--surface-2);
  border: 1px solid transparent;
  border-radius: 12px;
  height: 44px;
  padding: 0 10px;
  gap: 6px;
  min-width: 0;
}
.fld:focus-within {
  border-color: var(--accent);
}
.fld input {
  width: 100%;
  min-width: 0;
  border: 0;
  background: transparent;
  font-weight: 700;
  font-size: 16px;
  font-variant-numeric: tabular-nums;
  outline: none;
  padding: 0;
}
.fld input::placeholder {
  color: var(--muted);
  opacity: 0.6;
  font-weight: 600;
}
.fld u {
  text-decoration: none;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--muted);
}
.dn {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  border: 2px solid var(--line);
  background: transparent;
  display: grid;
  place-items: center;
  color: transparent;
}
.dn.on {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}
.row-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.lnk {
  border: 0;
  background: transparent;
  color: var(--accent-strong);
  font-weight: 700;
  font-size: 13px;
  padding: 6px 0;
  text-decoration: none;
}
.lnk:hover {
  text-decoration: underline;
}
.cue {
  font-size: 13.5px;
  color: var(--muted);
}
.btn {
  border: 0;
  border-radius: 14px;
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 800;
  padding: 0 18px;
  height: 48px;
  font-size: 15px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn.sec {
  background: var(--surface-2);
  color: var(--ink);
}
.btn.block {
  width: 100%;
}
.biset {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11.5px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--lime-ink);
  background: var(--lime);
  border-radius: 8px;
  padding: 3px 9px;
  align-self: flex-start;
}
.chain {
  margin-top: -6px;
  margin-bottom: -6px;
}

.check {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.tg {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 11px 12px;
  background: var(--surface);
  font-weight: 600;
  font-size: 14px;
  position: relative;
  min-height: 48px;
}
.tg input {
  appearance: none;
  -webkit-appearance: none;
  width: 22px;
  height: 22px;
  border-radius: 7px;
  border: 2px solid var(--line);
  flex: none;
  margin: 0;
  display: grid;
  place-items: center;
  background: transparent;
}
.tg input:checked {
  background: var(--accent);
  border-color: var(--accent);
}
.tg input:checked::after {
  content: '';
  width: 9px;
  height: 5px;
  border-left: 2.5px solid var(--accent-ink);
  border-bottom: 2.5px solid var(--accent-ink);
  transform: rotate(-45deg) translate(1px, -1px);
}
.tg:has(input:checked) {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.tg.wide {
  grid-column: 1/-1;
}
label.lb {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.in {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--surface-2);
  border-radius: 12px;
  padding: 11px 12px;
  font-size: 15px;
  font-weight: 600;
  text-transform: none;
  letter-spacing: 0;
  color: var(--ink);
  outline: none;
}
.in:focus {
  border-color: var(--accent);
}
textarea.in {
  min-height: 84px;
  resize: vertical;
  font-weight: 500;
  line-height: 1.4;
}
.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.sec-t {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.sub {
  font-size: 13px;
  color: var(--muted);
}
.list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* run */
.zone {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.big {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}
.big strong {
  font-family: var(--font-display);
  font-size: 44px;
  line-height: 1;
  font-weight: 700;
  color: var(--accent-strong);
}
.big span {
  color: var(--muted);
  font-weight: 600;
}
.circ {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.circ li {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  background: var(--surface-2);
  border-radius: 12px;
  padding: 10px 12px;
  font-weight: 600;
  font-size: 14px;
}
.circ li b {
  font-family: var(--font-display);
  font-size: 19px;
  color: var(--accent-strong);
}
.rounds {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.rd {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  border: 2px solid var(--line);
  background: transparent;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
}
.rd.on {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}

/* evolução */
.tiles {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.tile {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  box-shadow: var(--shadow);
}
.tile strong {
  font-family: var(--font-display);
  font-size: 32px;
  line-height: 1;
  font-weight: 700;
  color: var(--accent-strong);
}
.tile small {
  font-size: 11px;
  color: var(--muted);
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.xrow {
  display: grid;
  grid-template-columns: 1fr 84px;
  gap: 12px;
  align-items: center;
}
.xrow h3 {
  font-size: 15.5px;
  font-weight: 800;
}
.xrow .sub {
  margin-top: 2px;
}
.spark {
  width: 84px;
  height: 34px;
  color: var(--accent);
}
.delta {
  font-weight: 800;
  color: var(--accent-strong);
}
.tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
  font-variant-numeric: tabular-nums;
}
.tbl th {
  text-align: left;
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 6px 6px 6px 0;
}
.tbl td {
  padding: 7px 6px 7px 0;
  border-top: 1px solid var(--line);
}
.scroll-x {
  overflow-x: auto;
}
.empty {
  color: var(--muted);
  font-size: 13.5px;
}
.seg {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
}
.seg::-webkit-scrollbar {
  display: none;
}
.seg button {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 999px;
  height: 36px;
  padding: 0 14px;
  font-weight: 700;

/**

  MOD_KEY = 'disciplina2-mod';
var CLOUD = { msg: '', busy: false, t: null };

function cloudSession() {

    return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null');
  } catch (e) {
    return null;
  }
}
function cloudSetSession(s) {
  try {
    if (s) localStorage.setItem(AUTH_KEY, JSON.stringify(s));

function cloudMod() {
  try {
    return +localStorage.getItem(MOD_KEY) || 0;
  } catch (e) {
    return 0;

function cloudStatus(msg) {

  var el = document.getElementById('cloudMsg');
  if (el) el.textContent = msg;
}
function sbFetch(path, opt, token) {

  opt.headers = Object.assign(
    { apikey: SB_KEY, 'Content-Type': 'application/json' },

function sbErr(j, fallback) {
  var m = (j && (j.msg || j.error_description || j.message || j.error)) || fallback;
  if (/Invalid login/i.test(m)) return 'E-mail ou senha incorretos.';
  if (/not confirmed/i.test(m))
    return 'Confirme o e-mail pelo link que o Supabase enviou e tente de novo.';
  if (/already registered/i.test(m)) return 'Este e-mail já tem conta. Use Entrar.';
  if (/at least/i.test(m)) return 'A senha precisa de pelo menos 6 caracteres.';
  return m;
}
function cloudAuth(kind, email, pass) {
  var path = kind === 'up' ? '/auth/v1/signup' : '/auth/v1/token?grant_type=password';
  cloudStatus('Conectando...');
  return sbFetch(path, { method: 'POST', body: JSON.stringify({ email: email, password: pass }) })
    .then(function (r) {
      return r.json().then(function (j) {
        return { ok: r.ok, j: j };
      });
    })
    .then(function (x) {
      if (!x.ok) {
        cloudStatus(sbErr(x.j, 'Não foi possível entrar.'));
        return false;
      }
      if (!x.j.access_token) {
        cloudStatus('Conta criada. Confirme o e-mail pelo link enviado e depois toque em Entrar.');
        return false;
      }
      cloudSetSession({
        access: x.j.access_token,
        refresh: x.j.refresh_token,
        uid: x.j.user.id,
        email: x.j.user.email,
        exp: Date.now() + (x.j.expires_in || 3600) * 1000 - 60000

/** Devolve um token válido, renovando quando expirou. */
function cloudToken() {
  var s = cloudSession();
  if (!s) return Promise.resolve(null);
  if (Date.now() < s.exp) return Promise.resolve(s.access);
  return sbFetch('/auth/v1/token?grant_type=refresh_token', {
    method: 'POST',
    body: JSON.stringify({ refresh_token: s.refresh })
  })
    .then(function (r) {
      return r.json().then(function (j) {
        return { ok: r.ok, j: j };
      });
    })
    .then(function (x) {
      if (!x.ok || !x.j.access_token) {
        cloudSetSession(null);
        cloudStatus('Sessão expirada. Entre de novo.');
        return null;
      }
      s.access = x.j.access_token;
      s.refresh = x.j.refresh_token || s.refresh;

      headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({
        user_id: uid,
        data: cloudPayload(),
        modificado: mod,

  ).then(function (r) {

}
/** Compara o aparelho com a nuvem e mantém o mais recente. */
function cloudSync(quiet) {
  var s = cloudSession();
  if (!s || CLOUD.busy) return Promise.resolve();
  if (!cloudMod() && Object.keys(S.sets || {}).length) {
    try {
      localStorage.setItem(MOD_KEY, String(Date.now()));

  }
  CLOUD.busy = true;
  if (!quiet) cloudStatus('Sincronizando...');
  return cloudToken()
    .then(function (token) {
      if (!token) return null;
      return sbFetch(
        '/rest/v1/app_state?select=data,modificado&user_id=eq.' + s.uid,
        {},
        token
      ).then(function (r) {
        if (!r.ok) throw new Error('pull');

            local = cloudMod();

            var keep = S.sel;

            CLOUD.h = JSON.stringify(cloudPayload());
            try {
              localStorage.setItem(KEY, JSON.stringify(S));
              localStorage.setItem(MOD_KEY, String(remote.modificado));
            } catch (e) {}
            cloudStatus('Dados baixados da nuvem.');
            return 'pulled';
          }
          if (!remote || remote.modificado < local || !local) {
            return cloudPush(token, s.uid).then(function (m) {
              try {
                localStorage.setItem(MOD_KEY, String(m));
              } catch (e) {}
              cloudStatus(
                'Salvo na nuvem às ' +
                  new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) +
                  '.'
              );
              return 'pushed';
            });
          }
          cloudStatus('Tudo sincronizado.');
          return 'same';
        });
      });
    })
    .catch(function () {
      cloudStatus('Sem conexão agora. Seus dados estão salvos no aparelho e sobem depois.');

function cloudInit() {
  CLOUD.h = JSON.stringify(cloudPayload());

/** Início do app: baixa se a nuvem estiver mais nova. */
function cloudStart() {

  var last = pts[pts.length - 1];

    '<svg class="spark" viewBox="0 0 84 34" aria-hidden="true"><polyline points="' +
    pts

      '<p>Use a dupla progressão. Trabalhe dentro da faixa de reps (mín–máx). Quando fizer o máximo de reps em todas as séries, suba a carga (em geral 2,5 a 5 kg, menos nos isoladores) e volte ao mínimo da faixa. O app calcula a meta de cada exercício com base no seu último registro.</p>'
    ) +
    acc(
      'RPE e zonas de corrida',
      '<p><b>RPE</b> é a percepção de esforço de 0 a 10. RPE 7 deixa cerca de 3 reps na reserva. RPE 9 é quase a falha. Não force RPE 10 em toda série.</p><p style="margin-top:8px"><b>Z1</b> recuperação (50–60% FCmáx) · <b>Z2</b> aeróbia leve (60–70%) · <b>Z3</b> limiar moderado (70–85%) · <b>Z4</b> anaeróbia forte (85–95%) · <b>Z5</b> máxima (95–100%). Tiro é Z3–Z5, longão é Z1–Z2.</p>'
    ) +
    acc(
      'Técnicas de intensidade',
      '<dl>' +
        g
          .map(function (x) {
            return '<div><dt>' + esc(x[0]) + '</dt><dd>' + esc(x[1]) + '</dd></div>';
          })
          .join('') +
        '</dl>'
    ) +
    acc(
      'Upper / Lower',
      '<p>Upper é tronco (peito, costas, ombro, braços). Lower é pernas e glúteos. Upper A (segunda) e Upper B (quarta) misturam empurrar e puxar. O Lower (sexta) é o único dia de perna pesada, o resto da perna já trabalha no tiro, no circuito e no longão.</p>'
    ) +
    acc(
      'Segurança',
      '<p>Ajuste as cargas ao seu nível. Dor aguda ou articular não é desconforto que se caleja: pare e procure um profissional. RPE não significa chegar à falha técnica toda hora.</p>'
    ) +
    acc(
      'Programa Competidor (12 semanas)',
      '<p>Fases: <b>1–3 base</b> (3×8–10, aeróbio), <b>4–6 força e potência</b> (4–5 reps com cerca de 80%, explosivos a cerca de 70%), <b>7–9 específico</b> (menos volume, mais intensidade, rounds e simulações) e <b>10–12 polimento</b> (menos séries, mesma carga). A semana 12 termina na competição.</p>' +
        '<p style="margin-top:8px">Rotina: tatame segunda e quarta 7h30, quinta 18h30 e sábado 8h30. Força A na terça, Força B na sexta (pernas moderadas, pois o sábado tem jiu cedo) e potência curta no domingo. Para mudar os dias, edite <code>js/data/competidor.js</code>.</p>' +
        '<p style="margin-top:8px"><b>Metas de referência</b> para atletas avançados (revisão de Andreato et al., 2017): supino cerca de 1,3 a 1,5× o peso corporal, agachamento cerca de 1,2× e terra cerca de 1,7×. Use como direção, não como obrigação.</p>' +
        '<p style="margin-top:8px"><b>Corte de peso:</b> não improvise. Perder peso rápido derruba força e resistência. O ideal é chegar perto da categoria por dieta ao longo das semanas e conversar com um nutricionista esportivo antes de qualquer corte de água.</p>' +
        '<p style="margin-top:8px"><b>Semana da luta:</b> segunda só ativação curta, tatame leve na terça e quinta, véspera de descanso total. Nada de novidade em comida, equipamento ou aquecimento.</p>'
    ) +
    '<section class="card list"><div class="sec-t">Mentalidade</div></section>' +
    m
      .map(function (x) {
        return acc(x[0], '<p>' + esc(x[1]) + '</p>');
      })
      .join('') +
    cloudCard() +
    '<section class="card list"><div class="sec-t">Dados e plano</div>' +
    '<label class="lb">Início do programa (uma segunda-feira)<input class="in" type="date" id="startDate" value="' +
    esc(S.start || '') +
    '"></label>' +
    '<p class="sub">Com a data definida, o app abre sozinho na semana e no dia certos.</p>' +
    '<p class="sub">Seus registros ficam salvos neste aparelho. Copie o backup antes de trocar de celular ou limpar o navegador.</p>' +
    '<div class="row-actions"><button class="btn sec" type="button" data-act="backup">Copiar backup</button><button class="btn sec" type="button" data-act="restore">Restaurar</button></div>' +
    '<textarea class="in" id="bk" placeholder="Cole aqui o backup para restaurar" style="min-height:70px"></textarea><p class="sub" id="bkMsg" role="status"></p></section>'
  );
}

</script>
    <script>
/* js/app.js */
/** Ponto de entrada: render geral, eventos e inicialização. Deve ser o último script. */
function render(keepScroll) {
  var y = window.scrollY;
  renderHeader();
  renderNav();
  var v = S.sel.tab,
    html =
      v === 'treino'
        ? viewTreino()
        : v === 'evo'
          ? viewEvo()
          : v === 'rev'
            ? viewRev()
            : v === 'dieta'
              ? viewDieta()
              : viewGuia();
  document.getElementById('main').innerHTML = html;
  var wd = v === 'treino' || v === 'dieta' ? '' : 'none';
  document.getElementById('days').style.display = wd;
  document.getElementById('weeks').style.display = wd;
  document.getElementById('blockline').style.display = v === 'treino' ? '' : 'none';
  window.scrollTo(0, keepScroll ? y : 0);
}

/* ===================== EVENTOS ===================== */
function refreshMeta() {
  var w = S.sel.week,
    c = weekCount(w),
    t = document.getElementById('wkTxt'),
    b = document.getElementById('wkBar');
  if (t) t.textContent = c + ' de ' + weekTotal(w) + ' treinos';
  if (b) b.style.width = Math.min(100, (c / weekTotal(w)) * 100) + '%';
  renderHeader();
}
document.addEventListener('input', function (e) {
  var el = e.target,
    p = el.getAttribute && el.getAttribute('data-path');
  if (!p || el.type === 'checkbox') return;
  setPath(p, el.value);
  if (/\.mat(Min|Rpe)$/.test(p)) {
    var ml = document.getElementById('matLoad');
    if (ml) ml.textContent = matLoad(p.split('.')[1]);
  }
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.id === 'compDate') {
    S.comp = el.value;
    save();
    autoSel(true);
    render();
    return;
  }
  if (el.id === 'startDate') {
    S.start = el.value;
    save();
    autoSel(true);
    render();
    return;
  }
  if (el.classList && el.classList.contains('swapsel')) {
    var sid = el.getAttribute('data-sid');
    if (el.value) S.swaps[sid] = el.value;
    else delete S.swaps[sid];
    save();
    render(true);
    return;
  }
  var p = el.getAttribute && el.getAttribute('data-path');
  if (!p) return;
  if (el.type === 'checkbox') {
    setPath(p, el.checked);
    if (/\.treino$/.test(p) || /\.desc$/.test(p)) {
      if (S.sel.tab === 'treino') refreshMeta();
    }
    if (/^meals\./.test(p)) refreshDiet();
    if (/^suppOn\./.test(p)) render(true);
    if (/^suppTaken\./.test(p)) refreshSupp();
  }
});
document.addEventListener(
  'toggle',
  function (e) {
    var el = e.target;
    if (el.dataset && el.dataset.evo) {
      if (el.open) EVO_OPEN = el.dataset.evo;
      else if (EVO_OPEN === el.dataset.evo) EVO_OPEN = null;
    }
  },
  true
);
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]');
  if (!b) return;
  var a = b.dataset.act;
  if (a === 'week') {
    S.sel.week = +b.dataset.v;
    save();
    render(true);
  } else if (a === 'day') {
    S.sel.day = +b.dataset.v;
    save();
    render();
  } else if (a === 'program') {
    S.program = b.dataset.v;
    save();
    render(true);
  } else if (a === 'dsub') {
    S.sel.dsub = b.dataset.v;
    save();
    render();
  } else if (a === 'mattype') {
    setPath('days.' + dkey(S.sel.week, S.sel.day) + '.matType', b.dataset.v);
    render(true);
  } else if (a === 'tab') {
    S.sel.tab = b.dataset.v;
    save();
    render();
  } else if (a === 'done') {
    var p = 'sets.' + b.dataset.key + '.' + b.dataset.i + '.done',
      on = !getPath(p);
    setPath(p, on);
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on);
    if (on) {
      var s = +b.dataset.s;
      if (s > 0) startTimer([{ label: 'Descanso', sec: s, kind: 'rest' }]);
      else beep(660, 0.1);
    }
  } else if (a === 'fill') {
    var n = +b.dataset.n,
      kg = b.dataset.kg;
    for (var i = 0; i < n; i++) {
      var cur = getPath('sets.' + b.dataset.key + '.' + i + '.kg');
      if (!cur) setPath('sets.' + b.dataset.key + '.' + i + '.kg', String(kg).replace('.', ','));
    }
    render(true);
  } else if (a === 'round') {
    var q = 'days.' + dkey(S.sel.week, S.sel.day) + '.r' + b.dataset.r,
      v = !getPath(q);
    setPath(q, v);
    b.classList.toggle('on', v);
  } else if (a === 'timer') {
    var bl = blockOf(S.sel.week),
      t = b.dataset.t;
    if (t === 'tiro') startTimer(intervalPhases(TIRO[bl], true));
    else if (t === 'circ') startTimer(intervalPhases(CIRC[bl], false));
    else if (t === 'run')
      startTimer([{ label: 'Corrida leve', sec: +b.dataset.m * 60, kind: 'work' }]);
    else if (t === 'cond') startTimer(compCondPhases(bl));
    else if (t === 'fin') {
      var fc = JJ_FIN[bl],
        fp = [];
      for (var fi = 1; fi <= fc.rounds; fi++) {
        fp.push({ label: 'Round ' + fi, sec: fc.w, kind: 'work' });
        if (fi < fc.rounds) fp.push({ label: 'Descanso', sec: fc.r, kind: 'rest' });
      }
      startTimer(fp);
    } else if (t === 'longao') {
      var c = LONG[bl];
      startTimer([{ label: 'Corrida ' + c.z, sec: c.min * 60, kind: 'work' }]);
    } else if (t === 'mob') {
      var c4 = LONG[bl],
        ph = [];
      for (var v2 = 0; v2 < c4.voltas; v2++)
        MOB.forEach(function (m) {
          ph.push({ label: m, sec: 60, kind: 'work' });
        });
      startTimer(ph);
    }
  } else if (a === 'cloudin' || a === 'cloudup') {
    var em = document.getElementById('cEmail').value.trim(),
      pw = document.getElementById('cPass').value;
    if (!em || !pw) cloudStatus('Preencha e-mail e senha.');
    else cloudAuth(a === 'cloudup' ? 'up' : 'in', em, pw);
  } else if (a === 'cloudout') {
    cloudOut();
    render(true);
  } else if (a === 'cloudsync') {
    cloudSync().then(function (r) {
      if (r === 'pulled') {
        autoSel();
        render(true);
      }
    });
  } else if (a === 'resetswaps') {
    var dd = String(S.sel.day);
    Object.keys(S.swaps).forEach(function (k) {
      if (k.split('|')[0] === dd) delete S.swaps[k];
    });
    save();
    render(true);
  } else if (a === 'backup') {
    var txt = JSON.stringify(S),
      m = document.getElementById('bkMsg'),
      ta = document.getElementById('bk');
    ta.value = txt;
    function sel() {
      ta.select();
      m.textContent = 'Backup gerado acima. Copie o texto selecionado.';
    }
    try {
      navigator.clipboard.writeText(txt).then(function () {
        m.textContent = 'Backup copiado. Guarde em um lugar seguro.';
      }, sel);
    } catch (err) {
      sel();
    }
  } else if (a === 'restore') {
    var m2 = document.getElementById('bkMsg'),
      raw = document.getElementById('bk').value.trim();
    try {
      var o = JSON.parse(raw);
      if (!o || typeof o !== 'object' || !o.sets) throw 0;
      for (var k in S) if (o[k] !== undefined) S[k] = o[k];
      save();
      m2.textContent = 'Backup restaurado.';
      render(true);
    } catch (err) {
      m2.textContent = 'Não consegui ler o backup. Cole o texto completo copiado antes.';
    }
  }
});
document.getElementById('dkPause').addEventListener('click', function () {
  if (T.run) {
    T.left = T.end - Date.now();
    T.run = false;
  } else {
    T.end = Date.now() + T.left;
    T.run = true;
  }
  paintDock();
});
document.getElementById('dkSkip').addEventListener('click', function () {
  if (T.run || T.left > 0) {
    nextPhase();
    if (T.active && !T.run) {
      T.run = true;
    }
  }
  paintDock();
});
document.getElementById('dkAdd').addEventListener('click', function () {
  if (T.run) T.end += 15000;
  else T.left += 15000;
  T.total += 15;
  paintDock();
});
document.getElementById('dkClose').addEventListener('click', function () {
  T.active = false;
  T.run = false;
  paintDock();
});

function autoSel(force) {
  var ti = todayIdx();
  S.sel.day = ti;
  var st = isComp() ? compStart() : S.start;
  if (st) {
    var s = new Date(st + 'T00:00:00'),
      n = new Date();
    n.setHours(0, 0, 0, 0);
    var wk = Math.floor((n - s) / (7 * 864e5)) + 1;
    if (isFinite(wk)) S.sel.week = Math.min(weeksOf(), Math.max(1, wk));
  }
  if (S.sel.week > weeksOf()) S.sel.week = weeksOf();
  save();
}
load();
cloudInit();
if (!S.sel || typeof S.sel !== 'object') S.sel = { week: 1, day: 0, tab: 'treino' };
S.program = 'comp';
S.sel.tab = 'treino';
autoSel();
render();
cloudStart();

</script>
