<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Disciplina 2.0 Treino</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app de celular. Topo fixo (semana + dia), conteúdo em cartões, navegação inferior com 4 abas. */
:root{
  --bg:#EEF4F0; --surface:#FFFFFF; --surface-2:#E3EEE7; --ink:#0C1E15; --muted:#536A5D; --line:#D0DFD5;
  --accent:#0E9F57; --accent-strong:#0A7B43; --accent-ink:#FFFFFF; --accent-soft:#D5F2E1;
  --hero-a:#093F25; --hero-b:#0E7A43; --on-hero:#FFFFFF; --on-hero-muted:#BFE6CF; --lime:#C6F432; --lime-ink:#10300A;
  --warn:#B45309; --warn-soft:#FDEBD3; --shadow:0 1px 2px rgba(10,60,30,.06),0 6px 18px rgba(10,60,30,.07);
  --font-display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --font-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07120D; --surface:#0E1D15; --surface-2:#14281D; --ink:#E6F4EB; --muted:#8CA699; --line:#1C3727;
    --accent:#3DDC84; --accent-strong:#6CE9A3; --accent-ink:#04200F; --accent-soft:#12341F;
    --hero-a:#07301C; --hero-b:#0D5F36; --warn:#F0A04B; --warn-soft:#3A2810; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07120D; --surface:#0E1D15; --surface-2:#14281D; --ink:#E6F4EB; --muted:#8CA699; --line:#1C3727;
  --accent:#3DDC84; --accent-strong:#6CE9A3; --accent-ink:#04200F; --accent-soft:#12341F;
  --hero-a:#07301C; --hero-b:#0D5F36; --warn:#F0A04B; --warn-soft:#3A2810; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;
  background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-inline:0;padding-block:0 calc(var(--nav-h) + 24px);
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hero-a)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto}
.page{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- topo ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(160deg,var(--hero-a),var(--hero-b));color:var(--on-hero);padding-block:12px 10px;box-shadow:0 6px 20px rgba(5,40,20,.25)}
.top .wrap{display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{white-space:nowrap;font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.brand h1 b{color:var(--lime);font-weight:700}
.brand small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-hero-muted);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.wk{flex:0 0 auto;min-width:44px;height:34px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:var(--on-hero);font-weight:700;font-size:13px;padding:0 12px}
.wk[aria-pressed="true"]{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.wk[data-b="3"]:not([aria-pressed="true"]){border-color:rgba(198,244,50,.5)}
.blockline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--on-hero-muted)}
.rpe{background:var(--lime);color:var(--lime-ink);font-weight:800;border-radius:6px;padding:1px 7px;font-size:12px;letter-spacing:.04em}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dy{position:relative;border:0;border-radius:10px;background:rgba(255,255,255,.08);color:var(--on-hero);padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:700}
.dy span{font-size:11px;letter-spacing:.06em}
.dy em{font-style:normal;font-family:var(--font-display);font-size:11px;font-weight:600;opacity:.75;letter-spacing:.04em}
.dy[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.dy[aria-pressed="true"] em{opacity:.7}
.dy i{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--lime)}
.dy.today span::after{content:"";display:block;width:14px;height:2px;border-radius:2px;background:currentColor;margin:2px auto 0;opacity:.8}

/* ---------- conteúdo ---------- */
main{padding-top:16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.dayhead{display:flex;flex-direction:column;gap:10px}
.dayhead .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.dayhead h2{font-family:var(--font-display);font-size:30px;line-height:1.02;font-weight:700;letter-spacing:.01em;text-wrap:balance}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent-strong)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ghost{background:var(--surface-2);color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--lime));width:0;transition:width .3s}
.barlab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
.banner{border-radius:14px;padding:12px 14px;background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:13.5px}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.sum{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700}
.sum svg{transition:transform .2s;flex:none}
details[open]>.sum svg{transform:rotate(180deg)}
.sched{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.sched li{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:6px 8px;border-radius:8px;font-size:13.5px}
.sched li b{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;font-size:12.5px}
.sched li.hl{background:var(--accent-soft);color:var(--accent-strong);font-weight:700}
.sched li.hl b{color:inherit}

.ex{display:flex;flex-direction:column;gap:12px}
.ex-top{display:flex;gap:12px;align-items:flex-start}
.ex-n{flex:none;width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-family:var(--font-display);font-weight:700;font-size:20px;display:grid;place-items:center}
.ex-n.b{background:var(--lime);color:var(--lime-ink)}
.ex h3{font-size:17px;font-weight:800;line-height:1.2}
.ex .mu{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.spec{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.spec div{background:var(--surface-2);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.spec small{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.spec strong{font-family:var(--font-display);font-size:25px;line-height:1;font-weight:700;white-space:nowrap}
.spec strong.hot{color:var(--accent-strong)}
.tech{border-left:3px solid var(--lime);padding:2px 0 2px 10px;font-size:13px;color:var(--muted)}
.tech b{color:var(--ink)}
.hint{font-size:13px;border-radius:12px;padding:9px 12px;background:var(--accent-soft);color:var(--accent-strong);font-weight:600;display:flex;flex-direction:column;gap:2px}
.hint span{font-weight:500;color:var(--ink);opacity:.8;font-size:12.5px}
.sets{display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center}
.srow>span{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--muted);text-align:center}
.fld{display:flex;align-items:center;background:var(--surface-2);border:1px solid transparent;border-radius:12px;height:44px;padding:0 10px;gap:6px;min-width:0}
.fld:focus-within{border-color:var(--accent)}
.fld input{width:100%;min-width:0;border:0;background:transparent;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;outline:none;padding:0}
.fld input::placeholder{color:var(--muted);opacity:.6;font-weight:600}
.fld u{text-decoration:none;font-size:11.5px;font-weight:700;color:var(--muted)}
.dn{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;color:transparent}
.dn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lnk{border:0;background:transparent;color:var(--accent-strong);font-weight:700;font-size:13px;padding:6px 0;text-decoration:none}
.lnk:hover{text-decoration:underline}
.cue{font-size:13.5px;color:var(--muted)}
.btn{border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;padding:0 18px;height:48px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sec{background:var(--surface-2);color:var(--ink)}
.btn.block{width:100%}
.biset{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--lime-ink);background:var(--lime);border-radius:8px;padding:3px 9px;align-self:flex-start}
.chain{margin-top:-6px;margin-bottom:-6px}

.check{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tg{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:var(--surface);font-weight:600;font-size:14px;position:relative;min-height:48px}
.tg input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;margin:0;display:grid;place-items:center;background:transparent}
.tg input:checked{background:var(--accent);border-color:var(--accent)}
.tg input:checked::after{content:"";width:9px;height:5px;border-left:2.5px solid var(--accent-ink);border-bottom:2.5px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}
.tg:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.tg.wide{grid-column:1/-1}
label.lb{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.in{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 12px;font-size:15px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink);outline:none}
.in:focus{border-color:var(--accent)}
textarea.in{min-height:84px;resize:vertical;font-weight:500;line-height:1.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec-t{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.sub{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:12px}

/* run */
.zone{display:flex;flex-wrap:wrap;gap:6px}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big strong{font-family:var(--font-display);font-size:44px;line-height:1;font-weight:700;color:var(--accent-strong)}
.big span{color:var(--muted);font-weight:600}
.circ{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.circ li{display:flex;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}
.circ li b{font-family:var(--font-display);font-size:19px;color:var(--accent-strong)}
.rounds{display:flex;gap:8px;flex-wrap:wrap}
.rd{width:48px;height:48px;border-radius:14px;border:2px solid var(--line);background:transparent;font-family:var(--font-display);font-weight:700;font-size:20px}
.rd.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* evolução */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.tile strong{font-family:var(--font-display);font-size:32px;line-height:1;font-weight:700;color:var(--accent-strong)}
.tile small{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.xrow{display:grid;grid-template-columns:1fr 84px;gap:12px;align-items:center}
.xrow h3{font-size:15.5px;font-weight:800}
.xrow .sub{margin-top:2px}
.spark{width:84px;height:34px;color:var(--accent)}
.delta{font-weight:800;color:var(--accent-strong)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 6px 6px 0}
.tbl td{padding:7px 6px 7px 0;border-top:1px solid var(--line)}
.scroll-x{overflow-x:auto}
.empty{color:var(--muted);font-size:13.5px}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;height:36px;padding:0 14px;font-weight:700;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
dl{margin:0;display:flex;flex-direction:column;gap:10px}
dt{font-weight:800}
dd{margin:2px 0 0;color:var(--muted);font-size:14px}
.acc{padding:0}
.acc>summary{padding:14px 16px}
.acc .body{padding:0 16px 16px;color:var(--muted);font-size:14px}

/* dock timer */
.dock{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px);z-index:25;display:flex;justify-content:center;
  padding-inline:max(12px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.dock-in{pointer-events:auto;width:100%;max-width:616px;background:linear-gradient(150deg,var(--hero-a),var(--hero-b));color:var(--on-hero);border-radius:20px;padding:10px 12px 10px 16px;
  display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(3,30,15,.45)}
.dock-in.work{background:linear-gradient(150deg,#C6F432,#8EDB2A);color:var(--lime-ink)}
.dock small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;opacity:.85}
.dock .t{font-family:var(--font-display);font-size:44px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.dock .ctl{display:flex;gap:6px}
.dock .ctl button{height:42px;min-width:42px;border-radius:12px;border:0;background:rgba(255,255,255,.18);color:inherit;font-weight:800;padding:0 10px;font-size:13px}
.dock-in.work .ctl button{background:rgba(16,48,10,.16)}
.dock .pb{grid-column:1/-1;height:4px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
.dock-in.work .pb{background:rgba(16,48,10,.18)}
.dock .pb i{display:block;height:100%;background:currentColor;width:0}

/* nav */
nav.bar-nav{position:fixed;left:0;right:0;bottom:0;z-index:26;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
nav.bar-nav .in-nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--nav-h) - 6px)}
.meal{display:flex;flex-direction:column;gap:12px}
.meal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.meal-h h3{font-size:17px;font-weight:800;line-height:1.2}
.tg.mini{min-height:44px;padding:8px 12px;flex:none}
.ing{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ing>li{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.ing-t{width:100%}
.ing>li:first-child{border-top:0;padding-top:0}
.ing-t{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.ing-t b{font-weight:700;font-size:14.5px;min-width:0}
.ing-t em{font-style:normal;font-family:var(--font-display);font-size:18px;grid-row:1/3;grid-column:2;align-self:center;font-weight:700;color:var(--accent-strong);font-variant-numeric:tabular-nums}
.ing-t span{font-size:12.5px;color:var(--muted);font-weight:600}
.swapsel{max-width:100%;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:12.5px;font-weight:700;padding:0 12px;color:var(--accent-strong)}
.mtot{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.mtot span{background:var(--surface-2);border-radius:8px;padding:3px 8px}
.mtot span.k{background:var(--accent-soft);color:var(--accent-strong)}
ol.opts{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.nv{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;letter-spacing:.03em;border-radius:14px}
.nv svg{width:24px;height:24px}
.nv[aria-selected="true"]{color:var(--accent-strong)}
.nv[aria-selected="true"] svg{background:var(--accent-soft);border-radius:10px;padding:3px;width:32px;height:26px;box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (max-width:360px){.spec strong{font-size:21px}.check{grid-template-columns:1fr}}
</style>

<div class="top"><div class="wrap">
  <div class="brand"><h1>Disciplina <b>2.0</b></h1><small>8 semanas</small></div>
  <div class="chips" id="weeks" role="group" aria-label="Semana"></div>
  <div class="blockline" id="blockline"></div>
  <div class="days" id="days" role="group" aria-label="Dia da semana"></div>
</div></div>

<div class="wrap page"><main id="main"></main></div>

<div class="dock" id="dock" hidden><div class="dock-in" id="dockIn">
  <div><small id="dkLabel"></small><div class="t" id="dkTime">0:00</div></div>
  <div class="ctl"><button id="dkAdd" type="button">+15s</button><button id="dkPause" type="button">Pausar</button><button id="dkSkip" type="button">Pular</button><button id="dkClose" type="button" aria-label="Fechar">✕</button></div>
  <div class="pb"><i id="dkBar"></i></div>
</div></div>

<nav class="bar-nav" aria-label="Seções"><div class="in-nav" role="tablist" id="nav"></div></nav>

<script>
(function(){
'use strict';
/* ===================== DADOS ===================== */

function itemsFor(w,d){var b=blockOf(w),list=(LIFT[d]||{})[b]||[];

function minOf(it){return it.min==null?0:it.min}

/* histórico de um exercício: lista ordenada de sessões com carga/reps */
function history(id){var out=[];
  Object.keys(S.sets).forEach(function(k){var m=k.match(/^(\d+)-(\d)-(.+)$/);if(!m||m[3]!==id)return;
    var arr=(S.sets[k]||[]).filter(function(s){return s&&num(s.kg)>0&&num(s.reps)>0});if(!arr.length)return;
    var top=0;arr.forEach(function(s){top=Math.max(top,num(s.kg))});
    var work=arr.filter(function(s){return num(s.kg)===top});
    out.push({w:+m[1],d:+m[2],ord:+m[1]*10+ +m[2],sets:arr,top:top,work:work,reps:work.map(function(s){return num(s.reps)})})});
  out.sort(function(a,b){return a.ord-b.ord});return out}
function suggestion(it,w,d){var ex=EX[it.id],h=history(it.id),cur=w*10+d;
  var prev=null;for(var i=h.length-1;i>=0;i--){if(h[i].ord<cur){prev=h[i];break}}
  if(!prev&&h.length)prev=h[h.length-1];
  if(!prev)return{kg:null,msg:'Primeira vez neste exercício',sub:'Escolha uma carga em que sobrem cerca de '+(blockOf(w)===1?3:blockOf(w)===2?2:1)+' repetições na reserva e anote.'};
  var pm=progMax(it),mn=minOf(it),all=prev.reps.every(function(r){return r>=pm}),low=prev.reps.some(function(r){return r<mn});
  var last=fmt(prev.top)+' kg × '+prev.reps.join(', ');
  if(all)return{kg:prev.top+ex.inc,msg:'Meta de hoje: '+fmt(prev.top+ex.inc)+' kg',sub:'Última vez: '+last+'. Você bateu o máximo em todas as séries, então suba a carga.',last:prev.top};
  if(low)return{kg:prev.top,msg:'Meta de hoje: '+fmt(prev.top)+' kg',sub:'Última vez: '+last+'. Alguma série ficou abaixo do mínimo. Mantenha a carga e busque '+mn+' reps ou mais.',last:prev.top};
  return{kg:prev.top,msg:'Meta de hoje: '+fmt(prev.top)+' kg',sub:'Última vez: '+last+'. Mantenha a carga e tente +1 rep em cada série até chegar a '+pm+'.',last:prev.top}}

/* ===================== TIMER (dock) ===================== */
var T={phases:[],i:0,end:0,left:0,run:false,active:false,total:0};
var actx=null;
function beep(f,d){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();var o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=f;g.gain.value=.15;o.start();o.stop(actx.currentTime+d)}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function startTimer(phases){if(!phases.length)return;T.phases=phases;T.i=0;T.total=phases[0].sec;T.end=Date.now()+phases[0].sec*1000;T.run=true;T.active=true;beep(660,.12);
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){})}catch(e){}paintDock()}
function fmtT(ms){var s=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0')}
function paintDock(){var d=document.getElementById('dock');d.hidden=!T.active;if(!T.active)return;
  var ph=T.phases[T.i],left=T.run?T.end-Date.now():T.left;
  document.getElementById('dkTime').textContent=fmtT(left);
  var cnt=T.phases.filter(function(p){return p.kind==='work'}).length,idx=T.phases.slice(0,T.i+1).filter(function(p){return p.kind==='work'}).length;
  document.getElementById('dkLabel').textContent=ph.label+(cnt>1&&ph.kind!=='warm'?' · '+Math.max(idx,1)+'/'+cnt:'');
  document.getElementById('dockIn').className='dock-in'+(ph.kind==='work'?' work':'');
  document.getElementById('dkBar').style.width=(100*(1-Math.max(0,left)/(T.total*1000)))+'%';
  document.getElementById('dkPause').textContent=T.run?'Pausar':'Retomar';
  document.getElementById('dkAdd').hidden=T.phases.length>1}
function nextPhase(){if(T.i+1>=T.phases.length){T.active=false;T.run=false;beep(880,.5);buzz([200,100,200,100,400]);paintDock();return}
  T.i++;T.total=T.phases[T.i].sec;T.end=Date.now()+T.total*1000;beep(T.phases[T.i].kind==='work'?880:520,.25);buzz(T.phases[T.i].kind==='work'?[300]:[120,80,120])}
setInterval(function(){if(!T.active||!T.run)return;var left=T.end-Date.now();
  if(left<=0)nextPhase();else if(left<=3050&&left>2900&&T.phases[T.i].sec>5)beep(440,.08);paintDock()},200);
function intervalPhases(c,warm){var p=[];if(warm)p.push({label:'Aquecimento dinâmico',sec:600,kind:'warm'});
  for(var i=0;i<c.n;i++){p.push({label:'Corra '+c.zw,sec:c.w,kind:'work'});p.push({label:'Caminhe '+c.zr,sec:c.r,kind:'rest'})}return p}

function spark(h){if(h.length<2)return '<svg class="spark" viewBox="0 0 84 34"><line x1="4" y1="17" x2="80" y2="17" stroke="var(--line)" stroke-width="2" stroke-dasharray="3 4"/></svg>';
  var v=h.map(function(x){return x.top}),mn=Math.min.apply(null,v),mx=Math.max.apply(null,v),rg=mx-mn||1,pts=v.map(function(y,i){return [4+i*(76/(v.length-1)),28-((y-mn)/rg)*22]});
  var last=pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 84 34" aria-hidden="true"><polyline points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')+'" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3.6" fill="currentColor"/></svg>'}

function foodIds(grp){return Object.keys(FOODS).filter(function(k){return FOODS[k].g===grp})}
function calcItem(d,mi,ii){
  var it=DIET[d].meals[mi].items[ii],id=d+'|'+mi+'|'+ii,sw=S.swaps[id],F=sw&&FOODS[sw];
  if(!F)return {id:id,it:it,n:it.n,q:it.q,k:it.k,c:it.c,p:it.p,f:it.f,sw:false};
  var per=F.m,g;
  if(it.grp==='prot'&&it.p>0&&per[2]>0)g=it.p/per[2]*100;
  else if(it.grp==='veg')g=it.g||100;
  else g=it.k/per[0]*100;
  var q;
  if(F.u){var un=Math.max(1,Math.round(g/F.u));g=un*F.u;q=un+' un · '+g+' g'}
  else{g=Math.max(5,Math.round(g/5)*5);q=g+(F.ml?' ml':' g')}
  function r1(x){return Math.round(x*10)/10}
  return {id:id,it:it,n:F.n,q:q,k:Math.round(per[0]*g/100),c:r1(per[1]*g/100),p:r1(per[2]*g/100),f:r1(per[3]*g/100),sw:true}}
function mealCalc(d,mi){var t={k:0,c:0,p:0,f:0},rows=DIET[d].meals[mi].items.map(function(_,ii){var x=calcItem(d,mi,ii);t.k+=x.k;t.c+=x.c;t.p+=x.p;t.f+=x.f;return x});return {rows:rows,t:t}}
function dayCalc(d,w){var t={k:0,c:0,p:0,f:0,eaten:0,n:0,done:0};
  DIET[d].meals.forEach(function(_,mi){var m=mealCalc(d,mi);t.k+=m.t.k;t.c+=m.t.c;t.p+=m.t.p;t.f+=m.t.f;t.n++;if(getPath('meals.'+dkey(w,d)+'-'+mi)){t.eaten+=m.t.k;t.done++}});return t}
function lastWeight(){var best=null,bo=-1;Object.keys(S.days).forEach(function(k){var m=k.match(/^(\d+)-(\d)$/),v=S.days[k]&&num(S.days[k].peso);if(m&&v&&+m[1]*10+ +m[2]>bo){bo=+m[1]*10+ +m[2];best=v}});return best||76}
function viewDieta(){
  var w=S.sel.week,d=S.sel.day,D=DIET[d],t=dayCalc(d,w),kg=lastWeight(),out='';
  var plan=KCAL[d],sheet=D.total,swn=0;
  Object.keys(S.swaps).forEach(function(k){if(k.split('|')[0]==d)swn++});
  out+='<section class="card dayhead"><div><div class="k">Dieta · '+DAYS[d]+'</div><h2>'+TITLES[d]+'</h2></div>'+
   '<div class="big"><strong class="num" id="dtKcal">'+t.k.toLocaleString('pt-BR')+'</strong><span>kcal no dia'+(swn?' · '+swn+(swn>1?' trocas':' troca'):'')+'</span></div>'+
   '<div class="tiles"><div class="tile"><strong>'+fmt(Math.round(t.c))+'</strong><small>Carbo (g)</small></div><div class="tile"><strong>'+fmt(Math.round(t.p))+'</strong><small>Proteína (g)</small></div><div class="tile"><strong>'+fmt(Math.round(t.f))+'</strong><small>Gordura (g)</small></div></div>'+
   '<p class="sub">Proteína: <b class="num">'+fmt(Math.round(t.p/kg*100)/100)+' g/kg</b> (peso de referência '+fmt(kg)+' kg)</p>'+
   (sheet!==plan?'<div class="banner">A planilha de dieta soma '+sheet.toLocaleString('pt-BR')+' kcal neste dia e o plano de treino indica '+plan.toLocaleString('pt-BR')+' kcal.</div>':'')+
   '<div><div class="barlab"><span id="dtTxt">'+t.done+' de '+t.n+' refeições</span><span class="num" id="dtEat">'+t.eaten.toLocaleString('pt-BR')+' kcal</span></div><div class="bar"><i id="dtBar" style="width:'+(t.n?t.done/t.n*100:0)+'%"></i></div></div></section>';
  D.meals.forEach(function(M,mi){
    var mc=mealCalc(d,mi),ck=getPath('meals.'+dkey(w,d)+'-'+mi);
    var rows=mc.rows.map(function(x){var it=x.it,opts='';
      if(it.grp){opts='<select class="swapsel" data-sid="'+x.id+'" aria-label="Trocar '+esc(it.n)+'"><option value="">'+(x.sw?'Voltar ao original: '+esc(it.n):'Trocar alimento')+'</option>'+
        foodIds(it.grp).map(function(fid){return '<option value="'+fid+'"'+(S.swaps[x.id]===fid?' selected':'')+'>'+esc(FOODS[fid].n)+'</option>'}).join('')+'</select>'}
      return '<li><div class="ing-t"><b>'+esc(x.n)+(x.sw?' <span class="pill" style="font-size:11px;padding:1px 7px">trocado</span>':'')+'</b><em>'+x.k.toLocaleString('pt-BR')+' kcal</em><span>'+esc(x.q)+'</span></div>'+opts+'</li>'}).join('');
    out+='<article class="card meal"><div class="meal-h"><div><h3>'+esc(M.n)+'</h3>'+(M.t?'<div class="sub">'+esc(M.t.replace(/^(\d)/,'$1'))+'</div>':'')+'</div>'+
      '<label class="tg mini"><input type="checkbox" data-path="meals.'+dkey(w,d)+'-'+mi+'"'+(ck?' checked':'')+'><span>Comi</span></label></div>'+
      '<ul class="ing">'+rows+'</ul>'+
      '<div class="mtot"><span class="k">'+mc.t.k.toLocaleString('pt-BR')+' kcal</span><span>C '+fmt(Math.round(mc.t.c*10)/10)+'</span><span>P '+fmt(Math.round(mc.t.p*10)/10)+'</span><span>G '+fmt(Math.round(mc.t.f*10)/10)+'</span></div>'+
      (M.opts.length?'<details><summary class="sum" style="font-size:13px;color:var(--muted)">Trocas de refeição '+IC.chev+'</summary><ol class="opts">'+M.opts.map(function(o){return '<li>'+esc(o)+'</li>'}).join('')+'</ol></details>':'')+
      (M.note?'<p class="sub">'+esc(M.note)+'</p>':'')+'</article>'});
  out+='<section class="card list"><div class="sec-t">Ajustes da dieta</div><p class="sub">Use "Trocar alimento" em qualquer ingrediente. O app recalcula a quantidade para manter as calorias (ou a proteína, nas carnes e ovos). Valores aproximados pela tabela TACO. As trocas valem para todas as semanas e ficam salvas por dia da semana.</p>'+
    '<p class="sub">Peixe foi retirado das opções de troca e substituído por frango ou carne.</p>'+
    '<button class="btn sec block" type="button" data-act="resetswaps">Desfazer trocas deste dia</button></section>';
  return out}
function refreshDiet(){var w=S.sel.week,d=S.sel.day,t=dayCalc(d,w),a=document.getElementById('dtTxt'),b=document.getElementById('dtBar'),e=document.getElementById('dtEat');
  if(a)a.textContent=t.done+' de '+t.n+' refeições';if(b)b.style.width=(t.n?t.done/t.n*100:0)+'%';if(e)e.textContent=t.eaten.toLocaleString('pt-BR')+' kcal'}

function viewGuia(){
  var g=[['Dropset',TECH.dropset],['Bi-set / Tri-set',TECH['bi-set']],['Pirâmide',TECH['pirâmide']],['Cluster-set',TECH.cluster],['6×12','Peso pesado por 6 reps, cai 50% da carga e faz mais 12 reps.'],['Unilateral','Executa de um lado do corpo por vez. Ótimo para corrigir assimetrias.']];
  var m=[['Progressão em blocos','Estagnação é sinal de que o corpo se acostumou ao estímulo. O plano sobe a intensidade a cada bloco (RPE 7, 8 e 9) e usa deload na semana 8. Sem isso, mais treino vira só mais fadiga.'],
   ['Espelho da responsabilidade','Uma vez por dia, sozinho e sem celular, olhe no espelho e diga em voz alta o que prometeu fazer hoje e o que fez. Sem desculpa, só o fato.'],
   ['Regra dos 40%','Quando a cabeça pedir para parar, o corpo ainda tem reserva. Antes de encerrar uma série ou treino, tente mais uma repetição ou mais 5 minutos.'],
   ['Calejar a mente','Escolha todo dia algo desconfortável e seguro: treinar sem vontade, banho frio, fazer primeiro a tarefa que mais evita.'],
   ['Processo acima do resultado','Avalie a semana pelos hábitos cumpridos, não só pela balança. Fotos e energia contam tanto quanto o peso.'],
   ['Profissionalismo nos detalhes','Sono, hidratação e alimentação merecem a mesma seriedade do treino.'],
   ['Motivação é combustível ruim','Motivação vai e volta. Disciplina leva ao treino nos dias sem vontade nenhuma.']];
  function acc(t,body){return '<details class="card acc"><summary class="sum">'+esc(t)+IC.chev+'</summary><div class="body">'+body+'</div></details>'}
  return '<section class="card list"><div class="sec-t">Objetivo</div><p>Sair da estagnação unindo corrida híbrida, musculação Upper/Lower e dieta de ganho de massa, sem duplicar volume de perna nem treinar demais.</p></section>'+
   acc('Como progredir a carga','<p>Use a dupla progressão. Trabalhe dentro da faixa de reps (mín–máx). Quando fizer o máximo de reps em todas as séries, suba a carga (em geral 2,5 a 5 kg, menos nos isoladores) e volte ao mínimo da faixa. O app calcula a meta de cada exercício com base no seu último registro.</p>')+
   acc('RPE e zonas de corrida','<p><b>RPE</b> é a percepção de esforço de 0 a 10. RPE 7 deixa cerca de 3 reps na reserva. RPE 9 é quase a falha. Não force RPE 10 em toda série.</p><p style="margin-top:8px"><b>Z1</b> recuperação (50–60% FCmáx) · <b>Z2</b> aeróbia leve (60–70%) · <b>Z3</b> limiar moderado (70–85%) · <b>Z4</b> anaeróbia forte (85–95%) · <b>Z5</b> máxima (95–100%). Tiro é Z3–Z5, longão é Z1–Z2.</p>')+
   acc('Técnicas de intensidade','<dl>'+g.map(function(x){return '<div><dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd></div>'}).join('')+'</dl>')+
   acc('Upper / Lower','<p>Upper é tronco (peito, costas, ombro, braços). Lower é pernas e glúteos. Upper A (segunda) e Upper B (quarta) misturam empurrar e puxar. O Lower (sexta) é o único dia de perna pesada, o resto da perna já trabalha no tiro, no circuito e no longão.</p>')+
   acc('Segurança','<p>Ajuste as cargas ao seu nível. Dor aguda ou articular não é desconforto que se caleja: pare e procure um profissional. RPE não significa chegar à falha técnica toda hora.</p>')+
   '<section class="card list"><div class="sec-t">Mentalidade</div></section>'+m.map(function(x){return acc(x[0],'<p>'+esc(x[1])+'</p>')}).join('')+
   '<section class="card list"><div class="sec-t">Dados e plano</div>'+
    '<label class="lb">Início do programa (uma segunda-feira)<input class="in" type="date" id="startDate" value="'+esc(S.start||'')+'"></label>'+
    '<p class="sub">Com a data definida, o app abre sozinho na semana e no dia certos.</p>'+
    '<p class="sub">Seus registros ficam salvos neste aparelho. Copie o backup antes de trocar de celular ou limpar o navegador.</p>'+
    '<div class="row-actions"><button class="btn sec" type="button" data-act="backup">Copiar backup</button><button class="btn sec" type="button" data-act="restore">Restaurar</button></div>'+
    '<textarea class="in" id="bk" placeholder="Cole aqui o backup para restaurar" style="min-height:70px"></textarea><p class="sub" id="bkMsg" role="status"></p></section>'}

function render(keepScroll){
  var y=window.scrollY;renderHeader();renderNav();
  var v=S.sel.tab,html=v==='treino'?viewTreino():v==='evo'?viewEvo():v==='rev'?viewRev():v==='dieta'?viewDieta():viewGuia();
  document.getElementById('main').innerHTML=html;
  var wd=(v==='treino'||v==='dieta')?'':'none';
  document.getElementById('days').style.display=wd;
  document.getElementById('weeks').style.display=wd;
  document.getElementById('blockline').style.display=v==='treino'?'':'none';
  window.scrollTo(0,keepScroll?y:0)}

/* ===================== EVENTOS ===================== */
function refreshMeta(){var w=S.sel.week,c=weekCount(w),t=document.getElementById('wkTxt'),b=document.getElementById('wkBar');
  if(t)t.textContent=c+' de 6 treinos';if(b)b.style.width=(c/6*100)+'%';renderHeader()}
document.addEventListener('input',function(e){var el=e.target,p=el.getAttribute&&el.getAttribute('data-path');if(!p||el.type==='checkbox')return;setPath(p,el.value)});
document.addEventListener('change',function(e){var el=e.target;
  if(el.id==='startDate'){S.start=el.value;save();autoSel(true);render();return}
  if(el.classList&&el.classList.contains('swapsel')){var sid=el.getAttribute('data-sid');if(el.value)S.swaps[sid]=el.value;else delete S.swaps[sid];save();render(true);return}
  var p=el.getAttribute&&el.getAttribute('data-path');if(!p)return;
  if(el.type==='checkbox'){setPath(p,el.checked);if(/\.treino$/.test(p)||/\.desc$/.test(p)){if(S.sel.tab==='treino')refreshMeta()}if(/^meals\./.test(p))refreshDiet()}});
document.addEventListener('toggle',function(e){var el=e.target;if(el.dataset&&el.dataset.evo){if(el.open)EVO_OPEN=el.dataset.evo;else if(EVO_OPEN===el.dataset.evo)EVO_OPEN=null}},true);
document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
  if(a==='week'){S.sel.week=+b.dataset.v;save();render(true)}
  else if(a==='day'){S.sel.day=+b.dataset.v;save();render()}
  else if(a==='tab'){S.sel.tab=b.dataset.v;save();render()}
  else if(a==='done'){var p='sets.'+b.dataset.key+'.'+b.dataset.i+'.done',on=!getPath(p);setPath(p,on);b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);
    if(on){var s=+b.dataset.s;if(s>0)startTimer([{label:'Descanso',sec:s,kind:'rest'}]);else beep(660,.1)}}
  else if(a==='fill'){var n=+b.dataset.n,kg=b.dataset.kg;for(var i=0;i<n;i++){var cur=getPath('sets.'+b.dataset.key+'.'+i+'.kg');if(!cur)setPath('sets.'+b.dataset.key+'.'+i+'.kg',String(kg).replace('.',','))}render(true)}
  else if(a==='round'){var q='days.'+dkey(S.sel.week,S.sel.day)+'.r'+b.dataset.r,v=!getPath(q);setPath(q,v);b.classList.toggle('on',v)}
  else if(a==='timer'){var bl=blockOf(S.sel.week),t=b.dataset.t;
    if(t==='tiro')startTimer(intervalPhases(TIRO[bl],true));
    else if(t==='circ')startTimer(intervalPhases(CIRC[bl],false));
    else if(t==='longao'){var c=LONG[bl];startTimer([{label:'Corrida '+c.z,sec:c.min*60,kind:'work'}])}
    else if(t==='mob'){var c4=LONG[bl],ph=[];for(var v2=0;v2<c4.voltas;v2++)MOB.forEach(function(m){ph.push({label:m,sec:60,kind:'work'})});startTimer(ph)}}
  else if(a==='resetswaps'){var dd=String(S.sel.day);Object.keys(S.swaps).forEach(function(k){if(k.split('|')[0]===dd)delete S.swaps[k]});save();render(true)}
  else if(a==='backup'){var txt=JSON.stringify(S),m=document.getElementById('bkMsg'),ta=document.getElementById('bk');ta.value=txt;
    function sel(){ta.select();m.textContent='Backup gerado acima. Copie o texto selecionado.'}
    try{navigator.clipboard.writeText(txt).then(function(){m.textContent='Backup copiado. Guarde em um lugar seguro.'},sel)}catch(err){sel()}}
  else if(a==='restore'){var m2=document.getElementById('bkMsg'),raw=document.getElementById('bk').value.trim();
    try{var o=JSON.parse(raw);if(!o||typeof o!=='object'||!o.sets)throw 0;for(var k in S)if(o[k]!==undefined)S[k]=o[k];save();m2.textContent='Backup restaurado.';render(true)}catch(err){m2.textContent='Não consegui ler o backup. Cole o texto completo copiado antes.'}}
});
document.getElementById('dkPause').addEventListener('click',function(){if(T.run){T.left=T.end-Date.now();T.run=false}else{T.end=Date.now()+T.left;T.run=true}paintDock()});
document.getElementById('dkSkip').addEventListener('click',function(){if(T.run||T.left>0){nextPhase();if(T.active&&!T.run){T.run=true}}paintDock()});
document.getElementById('dkAdd').addEventListener('click',function(){if(T.run)T.end+=15000;else T.left+=15000;T.total+=15;paintDock()});
document.getElementById('dkClose').addEventListener('click',function(){T.active=false;T.run=false;paintDock()});

function autoSel(force){var ti=todayIdx();S.sel.day=ti;
  if(S.start){var s=new Date(S.start+'T00:00:00'),n=new Date();n.setHours(0,0,0,0);var wk=Math.floor((n-s)/(7*864e5))+1;if(isFinite(wk))S.sel.week=Math.min(8,Math.max(1,wk))}
  save()}
load();
if(!S.sel||typeof S.sel!=='object')S.sel={week:1,day:0,tab:'treino'};
S.sel.tab='treino';autoSel();
render();
})();
</script>
